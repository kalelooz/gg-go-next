[package]
name = "gg-go-next"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tiny_http = "0.12"
ureq = "2"
serde_json = "1"
tauri-plugin-global-shortcut = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
