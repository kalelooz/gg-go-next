<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dota Helper skill bar</title>
<style>
/* Sits on Dota's ability bar and marks what to click. The window is 1120x220 in 1080p units, from x 400
   and y 790 (see main.rs), so 1 unit = 100vw/1120 and a screen spot (x, y) is (x - 400, y - 790) here.
   Measured off a 1920x1080 screenshot of Luna: level-up "+" buttons y 902-935, ability boxes y 942-1002,
   ability centers 65 apart, talent tree centered at 742, 975. Spectre (5 buttons, 2026-10-26): centers 58 apart, same
   bar center 949, tree 110 left of the first button. Dota shrinks the buttons when a hero has more of them. */
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{--u:calc(100vw / 1120);font-family:Bahnschrift,'Segoe UI',sans-serif;font-stretch:semi-condensed;user-select:none;color:#fff}
#bar{visibility:hidden}
#bar.on{visibility:visible}
.lbl{position:absolute;transform:translateX(-50%);font-size:calc(15 * var(--u));font-weight:600;line-height:1.15;text-align:center;
  padding:calc(4 * var(--u)) calc(8 * var(--u));background:rgb(0 0 0 / .85);border:calc(1.5 * var(--u)) solid #FFD24A;
  border-radius:calc(4 * var(--u));text-shadow:0 1px 2px #000;max-width:calc(280 * var(--u));width:max-content;box-sizing:border-box}
.lbl small{font-size:.8em;color:#FFD24A;margin-left:.35em;white-space:nowrap}
/* the arrow under each label points at what to click */
.lbl::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:calc(6 * var(--u)) solid transparent;border-top-color:#FFD24A}
/* label bottom at y 890, just above the "+" */
#skill{bottom:calc((220 - 100) * var(--u))}
/* one gold frame around Dota's "+" and the ability box under it (y 899-1004) */
#frame{position:absolute;top:calc(109 * var(--u));width:calc(64 * var(--u));height:calc(105 * var(--u));transform:translateX(-50%);
  border:calc(2.5 * var(--u)) solid #FFD24A;border-radius:calc(4 * var(--u));box-sizing:border-box;
  box-shadow:0 0 calc(10 * var(--u)) #FFD24A,inset 0 0 calc(6 * var(--u)) rgb(255 210 74 / .5);animation:pulse 1.2s ease-in-out infinite}
/* ring around the talent tree (center 742, 975) and its label above it, bottom at y 928 */
#ring{position:absolute;left:calc(342 * var(--u));top:calc(185 * var(--u));width:calc(74 * var(--u));height:calc(74 * var(--u));
  transform:translate(-50%, -50%);border:calc(2.5 * var(--u)) solid #FFD24A;border-radius:50%;box-sizing:border-box;
  box-shadow:0 0 calc(10 * var(--u)) #FFD24A;animation:pulse 1.2s ease-in-out infinite}
/* its right edge stops at x 802, before the first "+" (822), and the arrow stays on the tree */
#talent{left:calc(342 * var(--u));bottom:calc((220 - 138) * var(--u));transform:translateX(calc(-100% + 60 * var(--u)))}
#talent::after{left:calc(100% - 60 * var(--u))}
@keyframes pulse{50%{box-shadow:0 0 calc(3 * var(--u)) #FFD24A;border-color:#ffe9a3}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#frame,#ring{animation:none}}
</style>
</head>
<body>
<div id="bar"><div class="lbl" id="skill" hidden></div><div id="frame" hidden></div><div id="ring" hidden></div><div class="lbl" id="talent" hidden></div></div>
<script type="module">
// ability button spacing by how many buttons the bar has, centered on x 949 (Luna 4, Spectre 5)
// shortcut: 6 is a guess from the 4 and 5 measurements; check Invoker or Rubick and adjust
const pitch = n => n <= 4 ? 65 : n === 5 ? 58 : 52;
const center = (i, n) => 949 + (i - (n - 1) / 2) * pitch(n) - 400;
// the talent tree sits 110 left of the first button, so it moves with the bar's width
const tree = n => center(0, n) - 110;
const IN_GAME = ['DOTA_GAMERULES_STATE_PRE_GAME', 'DOTA_GAMERULES_STATE_GAME_IN_PROGRESS'];
const $ = id => document.getElementById(id), bar = $('bar');
const at = (el, x) => { el.style.left = `calc(${x} * var(--u))`; };
let gotAt = 0, state = null, show = true;
setInterval(() => bar.classList.toggle('on', show && Date.now() - gotAt < 15000 && IN_GAME.includes(state)), 500);

const { listen } = window.__TAURI__.event;
listen('gsi', e => { try { const d = JSON.parse(e.payload); if (d.map) { state = d.map.game_state; gotAt = Date.now(); } } catch {} });
// sent by the main overlay whenever its Level up lines change: { skill: {name, votes, of, slot, n}, talent: {text} }
listen('skillpick', e => {
  const p = e.payload || {}, s = p.skill;
  $('skill').hidden = $('frame').hidden = !s;
  if (s) {
    $('skill').innerHTML = '';
    $('skill').append(s.name);
    if (s.of) $('skill').insertAdjacentHTML('beforeend', `<small>${s.votes}/${s.of}</small>`);
    at($('skill'), center(s.slot, s.n)); at($('frame'), center(s.slot, s.n));
    $('frame').style.width = `calc(${pitch(s.n) - 1} * var(--u))`;
  }
  $('talent').hidden = $('ring').hidden = !p.talent;
  if (p.talent) { $('talent').textContent = p.talent.text; at($('talent'), tree(p.talent.n || 4)); at($('ring'), tree(p.talent.n || 4)); }
});
listen('settings', e => { if (e.payload[0] === 'show') show = e.payload[1]; });
window.__TAURI__.core.invoke('get_settings').then(t => { if (t && 'show' in t) show = t.show; }).catch(() => {});
</script>
</body>
</html>
