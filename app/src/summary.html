<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Match summary</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch {}</script>
<style>
/* Styled after Dota's own post-game screen: fonts, greys, gold and team colours are taken from the game's
   panorama files (dotastyles.css, dashboard_page_post_game.css; see docs/icons.md for how to extract them).
   Radiance and Reaver are Valve's fonts, copied from dota/panorama/fonts (on the before-selling list). */
@font-face{font-family:Radiance;src:url(fonts/radiance-regular.otf);font-weight:400}
@font-face{font-family:Radiance;src:url(fonts/radiance-semibold.otf);font-weight:600}
@font-face{font-family:Radiance;src:url(fonts/radiance-bold.otf);font-weight:700}
@font-face{font-family:Reaver;src:url(fonts/reaver-semibold.otf);font-weight:600}
/* Dota's greys: LightestGrey, LighterGrey, LightGrey; goldColor; the post-game Radiant and Dire banner colours */
:root{--bg1:#1b2227;--bg2:#090c0e;--strip:#000000b7;--well:#00000066;--line:#ffffff1c;--ink:#dae2e5;--title:#b0bcc2;--label:#8b989e;--hi:#fff;
  --gold:#ffcc33;--goldv:#dcbb37;--rad:#b4fab6;--radline:#45bb5f;--radglow:#009900aa;--radban:#5bb10b77;
  --dire:#fa755f;--direline:#ff4949;--direglow:#990000aa;--direban:#ae332177;--lh:#cad3e7;color-scheme:dark}
:root[data-theme=light]{--bg1:#eef1f2;--bg2:#dfe5e8;--strip:#0000001a;--well:#0000000d;--line:#00000024;--ink:#1a2024;--title:#3b4448;--label:#4f5a5f;--hi:#0d1113;
  --gold:#8a6400;--goldv:#7a5a00;--rad:#17652a;--radline:#17652a;--radglow:#00990033;--radban:#5bb10b55;
  --dire:#b83224;--direline:#b0281f;--direglow:#99000033;--direban:#ae332155;--lh:#3d5a8a;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);font:15px/1.35 Radiance,'Segoe UI',sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none}
button{font:600 12px Radiance,'Segoe UI',sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--ink);cursor:pointer;
  background:linear-gradient(#ffffff1f,#ffffff0a);border:1px solid var(--line);border-radius:2px;padding:5px 10px}
button:hover{background:linear-gradient(#ffffff2e,#ffffff14);color:var(--hi)}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

header{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--strip);cursor:move}
header h1{flex:1;margin:0;font:600 13px Radiance,sans-serif;text-transform:uppercase;letter-spacing:2px;color:var(--title)}
.x{border:0;background:none;font-size:20px;line-height:1;padding:2px 8px;color:var(--label)}
.x:hover{background:none}
main{flex:1;overflow:auto;padding:0 0 14px}
.msg{color:var(--title);padding:40px 20px;margin:0;text-align:center}
.msg.err{color:var(--dire)}
.note{color:var(--label);font-size:13px;margin:8px 16px 0}

/* winner banner, then the two kill scores either side of the duration, as Dota draws them */
.banner{height:58px;margin-top:10px;display:flex;align-items:center;justify-content:center;
  font:600 30px/1 Reaver,Georgia,serif;text-transform:uppercase;letter-spacing:2px;text-shadow:2px 2px 4px #000a}
.banner.radiant{color:var(--rad);background:linear-gradient(90deg,transparent,var(--radban) 20%,transparent)}
:root[data-theme=light] .banner{text-shadow:none}
.banner.dire{color:var(--dire);background:linear-gradient(270deg,transparent,var(--direban) 20%,transparent)}
.scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 16px 10px}
.side{display:flex;flex-direction:column;align-items:center}
.side b{font-size:50px;font-weight:400;line-height:1;color:var(--hi);font-variant-numeric:tabular-nums}
.side.radiant b{text-shadow:0 0 12px var(--radglow)}
.side.dire b{text-shadow:0 0 12px var(--direglow)}
.side small,.dur small,.th{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--label)}
.side.radiant small{color:var(--radline)}.side.dire small{color:var(--direline)}
.side .you{margin-top:2px;color:var(--hi)}
.dur{text-align:center}
.dur b{display:block;font-size:24px;font-weight:400;color:var(--hi);font-variant-numeric:tabular-nums}

/* your row, laid out like a scoreboard line: column names on a dark strip, values under them */
.board{margin:0 12px;background:var(--well);border:1px solid var(--line)}
.cols,.row{display:grid;grid-template-columns:96px 1fr 1fr 1fr;align-items:center;column-gap:8px;padding:0 10px}
.cols{background:var(--strip);height:26px}
.row{padding-top:8px;padding-bottom:8px}
.row>span{font-size:20px;color:var(--hi);font-variant-numeric:tabular-nums}
.row i{font-style:normal;color:var(--label)}
.port{position:relative;width:88px;height:50px}
.port img{width:100%;height:100%;object-fit:cover;display:block;box-shadow:0 0 0 1px #000}
.port b{position:absolute;left:0;bottom:0;background:#000;color:#fff;font-size:12px;padding:0 4px;min-width:18px;text-align:center}
.name{grid-column:1/-1;font-size:14px;color:var(--title);padding:0 10px 8px}
.items{display:flex;align-items:center;gap:4px;padding:8px 10px;border-top:1px solid var(--line)}
.items img{width:50px;height:37px;object-fit:cover;display:block;box-shadow:0 0 0 1px #000,inset 0 0 4px #000}
.items .slot{width:50px;height:37px;background:#0007;box-shadow:inset 0 0 6px #000}
.items .neutral{width:37px;height:37px;border-radius:50%;margin-left:8px}
.lane{display:flex;gap:22px;padding:8px 10px;border-top:1px solid var(--line)}
.lane span{display:flex;flex-direction:column}
.lane b{font-size:18px;font-weight:400;color:var(--hi);font-variant-numeric:tabular-nums}

section{margin:18px 12px 0}
h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;padding-bottom:5px;
  font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--title);
  border-image:linear-gradient(90deg,var(--line),transparent) 0 0 1 0/0 0 1px 0}
h2 small{font-size:15px;letter-spacing:0;color:var(--goldv);text-transform:none}

/* Gold received rows, same layout and bar colours as Dota's post-game gold breakdown */
.gr{margin-bottom:10px}
.gr div{display:flex;align-items:baseline;gap:6px}
.gr .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--label)}
.gr .pct{font-size:13px;color:var(--ink)}
.gr .val{margin-left:auto;color:var(--goldv);font-variant-numeric:tabular-nums}
.gr .track{height:8px;background:#0008;margin-top:3px}
:root[data-theme=light] .gr .track{background:#0000001a}
.gr .track span{display:block;height:100%}

.graph{background:var(--well);border:1px solid var(--line);padding:8px 8px 2px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font:11px Radiance,'Segoe UI',sans-serif;fill:var(--label)}
.grid{stroke:var(--line)}
.keys{display:flex;gap:16px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--label);margin:6px 0 0}
.keys span{display:flex;align-items:center;gap:6px}
.keys i{width:14px;height:3px}
.keys i.dot{width:8px;height:8px;border-radius:50%}

.events{list-style:none;margin:0;padding:0;columns:2;column-gap:18px;font-size:14px}
.events li{display:flex;gap:10px;padding:3px 0;break-inside:avoid}
.events time{width:40px;text-align:right;color:var(--label);font-variant-numeric:tabular-nums;flex:none}
.radiant-c{color:var(--radline)}.dire-c{color:var(--direline)}
</style>
</head>
<body>
<header data-tauri-drag-region>
  <h1 data-tauri-drag-region>Match summary</h1>
  <button id="theme" type="button"></button>
  <button class="x" id="close" type="button" aria-label="Hide match summary">×</button>
</header>
<main id="main"><p class="msg">Loading your last match...</p></main>

<script type="module">
import { heroById } from './search.js';
import { fmt } from './timers.js';
import { newTracker, track, finish } from './summary.js';

const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const win = window.__TAURI__.window.getCurrentWindow();
const $ = id => document.getElementById(id);
const main = $('main');
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

// [feed field, label, Dota's bar colour from its gold breakdown]. Dota has no "shared" row; it gets the "Other" colour.
const SOURCES = [
  ['hero_kills', 'Heroes', '#e77c30'], ['creep_kills', 'Creeps', '#d92120'], ['summon_kills', 'Summons', '#dd3a0a'],
  ['income', 'Passive', '#d8af3d'], ['shared', 'Shared', '#781c81'],
];
const TEAM = { radiant: 'Radiant', dire: 'Dire' };
const other = t => (t === 'radiant' ? 'dire' : 'radiant');
// item art from Valve's CDN, same as the hero portraits (on the before-selling list)
const itemImg = n => `<img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/${n.slice(5)}.png" alt="${n.slice(5).replace(/_/g, ' ')}" title="${n.slice(5).replace(/_/g, ' ')}">`;
const num = n => n.toLocaleString('en-US');

// A line chart in game minutes. Each series is [{t, v}]; dots mark moments (deaths) on the first series.
function chart(series, dots = []) {
  const W = 520, H = 130, L = 34, B = 18;
  const all = series.flatMap(s => s.pts);
  const tMax = Math.max(60, ...all.map(p => p.t)), vMax = Math.max(1, ...all.map(p => p.v));
  const x = t => L + (W - L) * t / tMax, y = v => H - B - (H - B - 6) * v / vMax;
  const step = tMax > 2400 ? 600 : tMax > 900 ? 300 : 120;
  let out = '';
  for (let t = 0; t <= tMax; t += step) out += `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="6" y2="${H - B}"/><text x="${x(t)}" y="${H - 4}" text-anchor="middle">${t / 60}:00</text>`;
  for (const v of [0, vMax]) out += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${num(Math.round(v))}</text>`;
  for (const s of series) out += `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" points="${s.pts.map(p => `${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}"/>`;
  // a death sits on the line at the last sample before it
  const first = series[0].pts;
  for (const t of dots) {
    const v = [...first].reverse().find(p => p.t <= t)?.v ?? 0;
    out += `<circle cx="${x(t)}" cy="${y(v)}" r="4" fill="var(--direline)" stroke="#000" stroke-width="1.5"><title>Died at ${fmt(t)}</title></circle>`;
  }
  return `<div class="graph"><svg viewBox="0 0 ${W} ${H}" role="img">${out}</svg></div>`;
}

// minute samples plus the final totals, so the lines reach the end of the match
function points(s, pick, end) {
  const pts = s.minutes.map((m, i) => m && { t: i * 60, v: pick(m) }).filter(Boolean);
  pts.push({ t: s.duration, v: end });
  return pts;
}

function render(s) {
  const h = heroById[s.hero.id];
  const gold = Object.values(s.sources).reduce((a, b) => a + b, 0);
  const kp = s.score.ours ? Math.round((s.k + s.a) / s.score.ours * 100) : null;
  const winner = s.win ? s.team : other(s.team);
  const kills = { [s.team]: s.score.ours, [other(s.team)]: s.score.theirs };
  const side = t => `<div class="side ${t}"><b>${kills[t]}</b><small>${TEAM[t]}</small>${t === s.team ? `<small class="you">${s.win ? 'You won' : 'You lost'}</small>` : ''}</div>`;
  const sorted = SOURCES.filter(([k]) => s.sources[k] > 0).sort((a, b) => s.sources[b[0]] - s.sources[a[0]]);
  const ev = e => {
    const by = e.ours ? s.team : other(s.team);
    const text = e.what === 'Roshan' ? `${TEAM[by]} killed Roshan` : `${TEAM[by]} took ${e.what.replace(/^(Melee|Ranged)/, w => w.toLowerCase())}`;
    return `<li><time>${fmt(e.t)}</time><span class="${by}-c">${text}</span></li>`;
  };
  main.innerHTML = `
    <div class="banner ${winner}">${TEAM[winner]} victory</div>
    <div class="scores">${side('radiant')}<div class="dur"><small>Duration</small><b>${fmt(s.duration)}</b></div>${side('dire')}</div>

    <div class="board">
      <div class="cols th"><span>Hero</span><span>K / D / A</span><span>LH / DN</span><span>GPM / XPM</span></div>
      <div class="row">
        <div class="port">${h ? `<img src="${h.img}" alt="">` : ''}${s.hero.level ? `<b>${s.hero.level}</b>` : ''}</div>
        <span>${s.k} <i>/</i> ${s.d} <i>/</i> ${s.a}</span>
        <span>${s.lh} <i>/</i> ${s.dn}</span>
        <span>${num(s.gpm)} <i>/</i> ${s.xpm == null ? '?' : num(s.xpm)}</span>
      </div>
      <div class="name">${h ? h.name : 'Unknown hero'}</div>
      <div class="items">${s.items.map(n => (n ? itemImg(n) : '<span class="slot"></span>')).join('')}${s.neutral ? itemImg(s.neutral).replace('<img', '<img class="neutral"') : '<span class="slot neutral"></span>'}</div>
      <div class="lane">
        <span><small class="th">LH at 10:00</small><b>${s.lh10 ?? '?'}</b></span>
        <span><small class="th">DN at 10:00</small><b>${s.dn10 ?? '?'}</b></span>
        <span><small class="th">Kill participation</small><b>${kp == null ? '?' : kp + '%'}</b></span>
      </div>
    </div>
    ${s.from > 60 ? `<p class="note">The helper started ${fmt(s.from)} into the match, so the graphs begin there.</p>` : ''}

    <section><h2>Gold received <small>${num(gold)}</small></h2>
      ${sorted.map(([k, label, c]) => `<div class="gr">
        <div><span class="lbl">${label}</span><span class="pct">${Math.round(s.sources[k] / (gold || 1) * 100)}%</span><span class="val">${num(s.sources[k])}</span></div>
        <div class="track"><span style="width:${s.sources[k] / (gold || 1) * 100}%;background:linear-gradient(90deg,${c}99,${c})"></span></div>
      </div>`).join('')}
    </section>
    <section><h2>Gold earned</h2>
      ${chart([{ color: 'var(--gold)', pts: points(s, m => m.gold, gold) }], s.deaths)}
      ${s.deaths.length ? '<div class="keys"><span><i class="dot" style="background:var(--direline)"></i>Your deaths</span></div>' : ''}
    </section>
    <section><h2>Team kills</h2>
      ${chart([s.team, other(s.team)].map((t, i) => ({ color: `var(--${t === 'radiant' ? 'radline' : 'direline'})`, pts: points(s, m => (i ? m.theirs : m.ours), i ? s.score.theirs : s.score.ours) })))}
      <div class="keys"><span><i style="background:var(--radline)"></i>Radiant</span><span><i style="background:var(--direline)"></i>Dire</span></div>
    </section>
    <section><h2>Last hits</h2>${chart([{ color: 'var(--lh)', pts: points(s, m => m.lh, s.lh) }])}</section>
    <section><h2>Buildings and Roshan</h2>
      ${s.events.length ? `<ul class="events">${s.events.map(ev).join('')}</ul>` : '<p class="note">No towers, barracks or Roshan fell.</p>'}
    </section>`;
}

function show(s) {
  if (s) render(s);
  else main.innerHTML = '<p class="msg">No finished match yet. This opens by itself when your next match ends.</p>';
}

// last match from disk, so the tray item works after a restart
try { show(JSON.parse((await invoke('load_match')) || 'null')); }
catch (e) { main.innerHTML = `<p class="msg err">Couldn't read the last match: ${e}</p>`; }

// Collects through the whole match while hidden, then opens once when the match ends
let tr = null, shownFor = null, hiddenFor = null;
listen('gsi', async e => {
  let d; try { d = JSON.parse(e.payload); } catch { return; }
  const gs = d.map?.game_state;
  if (!gs) return;
  if (!tr || tr.matchId !== d.map.matchid) tr = newTracker(d.map.matchid);
  if (gs === 'DOTA_GAMERULES_STATE_GAME_IN_PROGRESS') track(tr, d);
  else if (gs === 'DOTA_GAMERULES_STATE_POST_GAME' && shownFor !== tr.matchId && d.player?.team_name) {
    shownFor = tr.matchId;
    const s = finish(tr, d);
    render(s);
    invoke('save_match', { json: JSON.stringify(s) }).catch(() => {});
    win.show(); win.setFocus();
  } else if (gs === 'DOTA_GAMERULES_STATE_HERO_SELECTION' && hiddenFor !== tr.matchId) {
    // out of the way once the next draft starts; the tray can still bring it back
    hiddenFor = tr.matchId;
    win.hide();
  }
});

function setTheme(t) {
  document.documentElement.dataset.theme = t; store.set('theme', t);
  $('theme').textContent = t === 'dark' ? 'Light' : 'Dark';
  $('theme').setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
}
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('close').onclick = () => win.hide();
addEventListener('keydown', e => { if (e.key === 'Escape') win.hide(); });
setTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
</script>
</body>
</html>
