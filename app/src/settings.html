<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customize overlay</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch {}</script>
<style>
/* Same look as the match summary: Dota's greys and gold, Radiance type (see summary.html) */
@font-face{font-family:Radiance;src:url(fonts/radiance-regular.otf);font-weight:400}
@font-face{font-family:Radiance;src:url(fonts/radiance-semibold.otf);font-weight:600}
:root{--bg1:#1b2227;--bg2:#090c0e;--strip:#000000b7;--well:#00000066;--line:#ffffff1c;--ink:#dae2e5;--title:#b0bcc2;--label:#8b989e;--hi:#fff;
  --gold:#ffcc33;--on:#45bb5f;color-scheme:dark}
:root[data-theme=light]{--bg1:#eef1f2;--bg2:#dfe5e8;--strip:#0000001a;--well:#0000000d;--line:#00000024;--ink:#1a2024;--title:#3b4448;--label:#4f5a5f;--hi:#0d1113;
  --gold:#8a6400;--on:#17652a;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);font:14px/1.35 Radiance,'Segoe UI',sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--strip);cursor:move}
header h1{flex:1;margin:0;font:600 13px Radiance,sans-serif;text-transform:uppercase;letter-spacing:2px;color:var(--title)}
.key{font-size:12px;color:var(--label);margin-right:6px}
.x{border:0;background:none;font-size:20px;line-height:1;padding:2px 8px;color:var(--label);cursor:pointer}
.x:hover{color:var(--hi)}
main{flex:1;display:grid;grid-template-columns:1fr 470px;min-height:0}

/* left: the switches */
#list{overflow:auto;padding:4px 14px 16px}
h2{margin:16px 0 4px;padding-bottom:5px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--title);
  border-image:linear-gradient(90deg,var(--line),transparent) 0 0 1 0/0 0 1px 0}
.opt{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:start;padding:8px 8px;border-radius:3px;cursor:pointer}
.opt:hover,.opt:focus-within{background:var(--well)}
.opt b{font-weight:600;color:var(--hi)}
.opt small{grid-column:2;color:var(--label);font-size:13px}
/* the checkbox is drawn as a small switch; the real input stays for keyboard and screen readers */
.opt input{appearance:none;margin:2px 0 0;width:30px;height:16px;border-radius:8px;background:#0008;border:1px solid var(--line);position:relative;cursor:pointer;grid-row:span 2}
.opt input::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--label);transition:transform .15s,background .15s}
.opt input:checked{background:color-mix(in srgb,var(--on) 35%,transparent);border-color:var(--on)}
.opt input:checked::after{transform:translateX(14px);background:var(--on)}
.opt input:disabled{opacity:.4}
select{font:inherit;color:var(--ink);background:var(--well);border:1px solid var(--line);border-radius:3px;padding:4px 6px;margin:4px 8px}

/* right: the overlay running on a made-up game, on a dark terrain backdrop */
#preview{border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.stage{position:relative;height:520px;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);
  background:radial-gradient(circle at 30% 70%,#3b4a2e,transparent 55%),linear-gradient(135deg,#26331f 0 45%,#2c4650 45% 54%,#26331f 54%)}
/* same shape as the overlay window (0.44 x 0.52 of screen height); color-scheme matches the page inside so it stays see-through */
.stage iframe{position:absolute;right:0;top:0;width:440px;height:520px;border:0;background:transparent;color-scheme:normal}
.cap{color:var(--label);font-size:13px;margin:0}
.cap b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<header data-tauri-drag-region>
  <h1 data-tauri-drag-region>Customize overlay</h1>
  <span class="key" data-tauri-drag-region>Ctrl+Shift+D opens and closes this, in game too</span>
  <button class="x" id="close" type="button" aria-label="Close">×</button>
</header>
<main>
  <div id="list"></div>
  <aside id="preview">
    <div class="stage"><iframe id="demo" src="index.html?demo" title="Overlay preview"></iframe></div>
    <p class="cap"><b>Live preview</b> on a made-up game at 5:38. Every switch changes it right away, and the part
      you point at gets a gold outline.</p>
  </aside>
</main>
<script type="module">
const { invoke } = window.__TAURI__.core;
const win = window.__TAURI__.window.getCurrentWindow();

// id, label, what it does, default; el_<part> ids show or hide that part of the overlay
const GROUPS = [
  ['Your role', [
    ['el_roleline', 'Show my role in game', 'A small line at the top: "Playing as Carry". If it guessed wrong, press Ctrl+Shift+D and pick the right one.'],
    ['role_filter', 'Fit the overlay to my role', 'Hides or fades what your role rarely needs, and only says what matters to you. A carry won\'t hear power runes; supports hear stacks.'],
  ]],
  ['Timers', [
    ['el_water', 'Water runes', 'At 2:00 and 4:00 only. Mids use them to refill a Bottle.'],
    ['el_power', 'Power rune', 'Every 2 minutes from 6:00. Mids and pos 4s fight for it.'],
    ['el_bounty', 'Bounty runes', 'Gold runes every 4 minutes, starting at 0:00.'],
    ['el_wisdom', 'Wisdom shrines', 'Experience shrines every 7 minutes.'],
    ['el_lotus', 'Lotus pools', 'A healing lotus every 3 minutes.'],
    ['el_stack', 'Stack camps', 'Pull a camp at :53 so a second one spawns.'],
    ['el_roshan', 'Roshan', 'His pit, when he moves, and when he can be back.'],
    ['el_tormentor', 'Tormentor', 'Which side it\'s on, from 20:00.'],
    ['el_aegis', 'Aegis', 'Time left on the Aegis after Roshan dies.'],
    ['el_glyphs', 'Glyphs', 'Green while the enemy glyph is down, so you know when to push.'],
  ]],
  ['Top strip', [
    ['el_dn', 'Day and night', 'Time to the next switch, and Night Stalker\'s night.'],
    ['el_tp', 'TP scroll', 'Ready, on cooldown, or missing.'],
    ['el_bb', 'Buyback', 'Ready, on cooldown, or how much gold you\'re short.'],
    ['el_cr', 'Courier', 'Only shows while your courier is dead.'],
  ]],
  ['Panels', [
    ['el_wards', 'Wards', 'How many wards your team has up and the next one to run out.'],
    ['el_items', 'Items now', 'What players on your hero finish around this minute, with win rates.'],
  ]],
  ['Style', [
    ['icons', 'Icon view', 'Dota\'s icons instead of the timer names.', false],
    ['jokes', 'Jokes', 'A little humour when the map is dark or you have no TP.'],
  ]],
  ['Voice', [
    ['voice', 'Voice alerts', 'Says the important timers out loud.'],
    ['voice_runes', 'Runes', 'Calls runes 20 seconds before they spawn.'],
    ['voice_stack', 'Stacks', 'Says "stack in 5" before :53.'],
    ['voice_roshan', 'Roshan', 'His moves, his respawn, and the Aegis running out.'],
  ]],
];
// same list as VOICES in main.rs
const VOICES = [['am_michael', 'Michael (US)'], ['am_fenrir', 'Fenrir (US)'], ['am_puck', 'Puck (US)'], ['af_heart', 'Heart (US)'],
  ['af_bella', 'Bella (US)'], ['af_nicole', 'Nicole (US, soft)'], ['bm_george', 'George (UK)'], ['bf_emma', 'Emma (UK)']];

const saved = await invoke('get_settings').catch(() => ({})) || {};
const value = (id, def = true) => saved[id] ?? def;
const list = document.getElementById('list');
// same list as ROLES in main.rs
const ROLES = [['auto', 'Auto (guess from your lane)'], ['1', 'Carry'], ['2', 'Mid'], ['3', 'Offlane'], ['4', 'Soft support'], ['5', 'Hard support']];
const rolePick = `<label class="opt" style="grid-template-columns:1fr"><b>Role</b><select id="role">${ROLES.map(([v, l]) =>
  `<option value="${v}" ${value('role', 'auto') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
list.innerHTML = GROUPS.map(([name, opts], gi) => `<h2>${name}</h2>` + (gi === 0 ? rolePick : '') + opts.map(([id, label, what, def]) =>
  `<label class="opt" data-id="${id}"><input type="checkbox" id="${id}" ${value(id, def) ? 'checked' : ''}><b>${label}</b><small>${what}</small></label>`).join('')).join('')
  + `<label class="opt" style="grid-template-columns:1fr"><b>Voice</b><select id="voice_pick">${VOICES.map(([v, l]) =>
    `<option value="${v}" ${value('voice_pick', 'am_michael') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;

const demo = document.getElementById('demo');
const tell = (id, v, animate = true) => demo.contentWindow?.postMessage([id, v, animate], '*');
// the voice sub-switches only matter while voice is on
const voiceSubs = () => ['voice_runes', 'voice_stack', 'voice_roshan', 'voice_pick'].forEach(id => document.getElementById(id).disabled = !document.getElementById('voice').checked);
voiceSubs();

list.addEventListener('change', e => {
  const el = e.target, v = el.type === 'checkbox' ? el.checked : el.value;
  invoke('set_setting', { id: el.id, value: v }).catch(() => {});
  tell(el.id, v);
  if (el.id === 'voice') voiceSubs();
});
// point at the part in the preview
const partOf = el => el.closest('.opt')?.dataset.id?.match(/^el_(.+)/)?.[1] || null;
list.addEventListener('mouseover', e => tell('highlight', partOf(e.target)));
list.addEventListener('mouseleave', () => tell('highlight', null));
list.addEventListener('focusin', e => tell('highlight', partOf(e.target)));

// the preview starts with everything on, so give it the current switches without animating
demo.addEventListener('load', () => setTimeout(() =>
  { list.querySelectorAll('input').forEach(i => tell(i.id, i.checked, false)); tell('role', document.getElementById('role').value, false); }, 300));

const hide = () => win.hide();
document.getElementById('close').onclick = hide;
addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
</script>
</body>
</html>
