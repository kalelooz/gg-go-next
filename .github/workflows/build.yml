# Builds the exe on GitHub's own Windows machines, so anyone can check that a release comes from this code.
# Every push and pull request runs the tests and keeps the exe as a build artifact.
# Pushing a tag like v0.2.0 also publishes a release with the exe, its SHA-256, and latest.json for one-click updates.
name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: npm test

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test

      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: app
        run: npx tauri build

      # Releases also sign the setup for the in-app updater; the key and its password are repository secrets
      - name: Build and sign the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      # The updater reads latest.json from the newest release: version, notes, and the setup's address and signature
      - name: Write latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $sig = Get-Content (Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe.sig) -Raw
          New-Item -ItemType Directory dist -Force | Out-Null
          @{
            version = $version
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{ 'windows-x86_64' = @{
              signature = $sig.Trim()
              url = "https://github.com/kalelooz/gg-go-next/releases/download/v$version/GG-Go-Next-setup.exe"
            } }
          } | ConvertTo-Json -Depth 4 | Set-Content dist/latest.json
          Get-Content dist/latest.json

      # Release notes: this version's section of CHANGELOG.md, then the SHA-256 of both downloads
      - name: Name the files, hash them and write the notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item app/src-tauri/target/release/gg-go-next.exe dist/GG-Go-Next.exe
          Copy-Item (Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe) dist/GG-Go-Next-setup.exe
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $notes = @(); $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') { $inside = $line.Trim() -eq "## $version"; continue }
            if ($inside) { $notes += $line }
          }
          $notes += '', '**Download:** `GG-Go-Next-setup.exe` installs it (updates in place, settings stay). `GG-Go-Next.exe` runs without installing.', ''
          foreach ($f in 'GG-Go-Next-setup.exe', 'GG-Go-Next.exe') {
            $notes += "SHA-256 of ${f}: ``$((Get-FileHash dist/$f -Algorithm SHA256).Hash)``  "
          }
          $notes -join "`n" | Set-Content dist/NOTES.md
          Get-Content dist/NOTES.md

      - uses: actions/upload-artifact@v7
        with:
          name: gg-go-next
          path: dist/

      # A re-pushed tag (after a history rewrite) must not rebuild a release people already downloaded
      - name: Check for an existing release
        id: existing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME -R $env:GITHUB_REPOSITORY *> $null
          "found=$($LASTEXITCODE -eq 0)" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && steps.existing.outputs.found != 'True'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/GG-Go-Next-setup.exe
            dist/GG-Go-Next.exe
            dist/latest.json
          body_path: dist/NOTES.md
